  <rect x="6" y="19" width="5" height="6" rx="1" fill="#e8ff47" opacity="0.35"/>
  <rect x="21" y="7" width="5" height="6" rx="1" fill="#e8ff47" opacity="0.35"/>
  <rect x="21" y="19" width="5" height="6" rx="1" fill="#e8ff47" opacity="0.35"/>

  <!-- Accent dot -->
  <circle cx="27" cy="26" r="1.5" fill="#e8ff47"/>
</svg>

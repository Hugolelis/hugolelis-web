<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Left vertical bar -->
  <rect x="6" y="7" width="5" height="18" rx="1" fill="#e8ff47" opacity="0.15"/>

  <!-- Right vertical bar -->
  <rect x="21" y="7" width="5" height="18" rx="1" fill="#e8ff47" opacity="0.15"/>

  <!-- Crossbar — the main accent -->
